version: "3.9"

services:

  mongo:
    restart: always
    image: mongo
    container_name: mongo
    ports:
      - "8081:8081"

  redis:
    image: redis
    restart: always
    container_name: redis
    working_dir: /code
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile_frontend
    restart: always
    image: node:18
    tty: true
    container_name: frontend
    ports:
      - "3001:80"
      - "80:80"
        
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile_backend
    restart: always
    image: node:18
    tty: true
    container_name: backend
    ports:
      - "3000:3000"
